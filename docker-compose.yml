version: "3.9"

services:
  itisri:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itisri
    volumes:
      - ./:/app
      - itisri_data:/app/data
    working_dir: /app
    command: python -m demo_agent.run
    environment:
      - ITISRI_LOG_LEVEL=INFO
      - ITISRI_DATA_DIR=/app/data
    stdin_open: true
    tty: true

  itisri-tests:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itisri-tests
    volumes:
      - ./:/app
    working_dir: /app
    command: pytest
    profiles:
      - test

volumes:
  itisri_data:
