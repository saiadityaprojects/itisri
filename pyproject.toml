[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "itisri"
version = "0.1.0"
description = "Runtime detection and response engine for agentic AI security"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Sai Aditya" }
]
keywords = ["ai-security", "agentic-ai", "prompt-injection", "llm-security", "detection-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "black>=24.1",
    "mypy>=1.8",
]

[project.scripts]
itisri = "itisri.cli.main:app"

[project.urls]
Homepage = "https://github.com/saiadityaprojects/itisri"
Repository = "https://github.com/saiadityaprojects/itisri"
Issues = "https://github.com/saiadityaprojects/itisri/issues"
Documentation = "https://github.com/saiadityaprojects/itisri/blob/main/README.md"

[tool.setuptools.packages.find]
include = ["itisri*", "demo_agent*", "benchmark*"]

[tool.setuptools.package-data]
itisri = ["rules/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
