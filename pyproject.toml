[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "itisri"
version = "0.1.0"
description = "Runtime detection and response engine for agentic AI security"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Sai Aditya" }
]
keywords = ["ai-security", "agentic-ai", "prompt-injection", "llm-security", "detection-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0,<7",
    "scikit-learn>=1.5,<2",
    "numpy>=1.26,<2",
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
    "typer>=0.12,<1",
    "rich>=13.7,<14",
    "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=4.1,<6",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.3,<1",
    "black>=24.1,<25",
    "mypy>=1.8,<2",
]

[project.scripts]
itisri = "itisri.cli.main:app"

[project.urls]
Homepage = "https://github.com/saiadityaprojects/itisri"
Repository = "https://github.com/saiadityaprojects/itisri"
Issues = "https://github.com/saiadityaprojects/itisri/issues"
Documentation = "https://github.com/saiadityaprojects/itisri/blob/main/README.md"

[tool.setuptools.packages.find]
include = ["itisri*", "demo_agent*", "benchmark*"]

[tool.setuptools.package-data]
itisri = ["rules/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
